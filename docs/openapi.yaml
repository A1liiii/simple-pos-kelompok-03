openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      parameters:
        - name: page
          in: query
          description: Nomor halaman
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          description: Jumlah produk per halaman
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15

        - name: category_id
          in: query
          description: Filter berdasarkan kategori
          required: false
          schema:
            type: integer

        - name: q
          in: query
          description: Pencarian berdasarkan nama produk
          required: false
          schema:
            type: string
            minLength: 2

        - name: sort
          in: query
          description: Pengurutan produk
          required: false
          schema:
            type: string
            enum:
              - name
              - '-name'
              - price
              - '-price'
            default: name

      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string }

                  links:
                    type: object
                    properties:
                      first: { type: string, nullable: true }
                      last: { type: string, nullable: true }
                      prev: { type: string, nullable: true }
                      next: { type: string, nullable: true }

                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

# Pengujian di Postman menghasilkan 200 OK untuk login kasir dan
# pengambilan daftar produk, serta 201 Created untuk pembuatan transaksi.
# Saat field product_id belum benar, respons 422 langsung menunjukkan
# field yang perlu diperbaiki. Di Postman, token, header, dan body JSON
# lebih mudah diperiksa karena punya tab masing-masing. Sementara itu,
# curl lebih praktis untuk mengulang request yang sama dari terminal.
